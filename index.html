
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <title>ابوالفضل خورشیدی پاجی | کارت تماس</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --panel: #111b2d;
      --text: #f1f5ff;
      --muted: #91a3bd;
      --accent: #38a5ff;
      --line: #ffffff16;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 50% 0%, #12365d 0, transparent 55%),
        radial-gradient(ellipse at 100% 100%, #101d38 0, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, "Segoe UI", sans-serif;
    }

    a, button { font: inherit; }

    .card {
      width: min(100%, 460px);
      padding: 30px;
      border: 1px solid #38a5ff30;
      border-radius: 28px;
      background: linear-gradient(145deg, #15243bf2, #0c1423f7);
      box-shadow: 0 24px 80px #0009, 0 0 35px #1675cc12;
      backdrop-filter: blur(18px);
    }

    .top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 27px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 22px;
      background: linear-gradient(135deg, #38a5ff, #1764d8);
      color: white;
      font-size: 29px;
      font-weight: 800;
      box-shadow: 0 5px 25px #168bff35;
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(21px, 6vw, 28px);
      line-height: 1.5;
      letter-spacing: -.5px;
      overflow-wrap: anywhere;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .rule {
      height: 1px;
      background: var(--line);
      margin: 0 0 20px;
    }

    .links {
      display: grid;
      gap: 11px;
    }

    .link {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--line);
      background: #ffffff06;
      transition: .2s ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-2px);
      border-color: #38a5ff88;
      background: #38a5ff12;
      outline: none;
      box-shadow: 0 5px 20px #168bff12;
    }

    .icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: var(--accent);
      flex: none;
    }

    .icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label { font-weight: 650; }

    .detail {
      margin-right: auto;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 23px;
      text-align: center;
      color: #62758f;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media(max-width: 420px) {
      .card {
        padding: 22px 18px;
        border-radius: 24px;
      }

      .top {
        align-items: flex-start;
        gap: 13px;
        margin-bottom: 23px;
      }

      .avatar {
        width: 56px;
        height: 56px;
        border-radius: 18px;
      }

      h1 { font-size: 21px; }

      .link {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        column-gap: 12px;
        row-gap: 3px;
        padding: 11px 13px;
      }

      .icon {
        grid-column: 1;
        grid-row: 1/3;
        align-self: center;
      }

      .label {
        grid-column: 2;
        grid-row: 1;
      }

      .detail {
        grid-column: 2;
        grid-row: 2;
        margin: 0;
        justify-self: start;
        font-size: 11px;
      }
    }

    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
