<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101815">
  <meta name="description" content="راه‌های ارتباط با ابوالفضل خورشیدی پاجی">
  <title>ابوالفضل خورشیدی پاجی | کارت تماس</title>
  <style>
    :root{color-scheme:dark;--bg:#101815;--panel:#19231e;--text:#f3f5ed;--muted:#aab5aa;--accent:#c9f27a;--line:#ffffff18}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 0%,#26382c 0,transparent 55%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}
    a,button{font:inherit}
    .card{width:min(100%,440px);padding:30px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#1e2b24f2,#151e19f5);box-shadow:0 24px 80px #0006}
    .top{display:flex;align-items:center;gap:16px;margin-bottom:27px}
    .avatar{width:68px;height:68px;display:grid;place-items:center;flex:none;border-radius:22px;background:var(--accent);color:#172015;font-size:29px;font-weight:800}
    h1{margin:0 0 7px;font-size:clamp(21px,6vw,28px);line-height:1.5;letter-spacing:-.5px;overflow-wrap:anywhere}.intro{margin:0;color:var(--muted);font-size:14px}
    .rule{height:1px;background:var(--line);margin:0 0 20px}
    .links{display:grid;gap:11px}
    .link,.save{min-height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:16px;text-decoration:none;color:var(--text);border:1px solid var(--line);background:#ffffff06;transition:transform .18s ease,border-color .18s ease,background .18s ease}
    .link:hover,.link:focus-visible{transform:translateY(-2px);border-color:#c9f27a88;background:#c9f27a0d;outline:none}
    .icon{width:22px;height:22px;display:grid;place-items:center;color:var(--accent);flex:none}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .label{font-weight:650}.detail{margin-right:auto;color:var(--muted);font-size:13px;direction:ltr}
    .save{width:100%;justify-content:center;margin-top:18px;background:var(--accent);border-color:var(--accent);color:#182115;font-weight:750;cursor:pointer;transition:filter .18s ease,transform .18s ease}
    .save:hover,.save:focus-visible{filter:brightness(1.06);transform:translateY(-1px);outline:3px solid #c9f27a55;outline-offset:2px}
    .save svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .hint{min-height:20px;margin:12px 0 0;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:420px){.card{padding:22px 18px;border-radius:24px}.top{align-items:flex-start;gap:13px;margin-bottom:23px}.avatar{width:56px;height:56px;border-radius:18px}h1{font-size:21px}.link{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:12px;row-gap:3px;padding:11px 13px}.icon{grid-column:1;grid-row:1/3;align-self:center}.label{grid-column:2;grid-row:1}.detail{grid-column:2;grid-row:2;margin:0;font-size:12px;justify-self:start}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
