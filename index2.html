<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="راه‌های ارتباط با ابوالفضل خورشیدی پاجی">
  <title>ابوالفضل خورشیدی پاجی | کارت تماس</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f8ff;
      --muted: #8fa5c4;
      --blue: #4da6ff;
      --blue-2: #1f6feb;
      --cyan: #7fe0ff;
      --black: #02040a;
      --edge: #bfe0ff2b;
      --mx: 50%;
      --my: 50%;
    }

    * { box-sizing: border-box; }

    html { background: var(--black); }

    body {
      min-height: 100svh;
      margin: 0;
      padding: 30px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      color: var(--ink);
      background: linear-gradient(160deg, #02040a 0%, #050c1b 45%, #02040a 100%);
      font-family: Tahoma, "Segoe UI", sans-serif;
    }

    /* ---------- پس‌زمینه ---------- */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .55;
      will-change: transform;
    }
    .orb.o1 { width: 520px; height: 520px; top: -160px; right: -120px; background: #1459d9; animation: float1 18s ease-in-out infinite; }
    .orb.o2 { width: 460px; height: 460px; bottom: -170px; left: -140px; background: #0a3a8f; animation: float2 22s ease-in-out infinite; }
    .orb.o3 { width: 280px; height: 280px; top: 42%; left: 52%; background: #1a8fff; opacity: .28; animation: float3 26s ease-in-out infinite; }

    @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,90px) scale(1.12); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(90px,-80px) scale(1.1); } }
    @keyframes float3 { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-30%,-70%) scale(1.25); } }

    .grid {
      position: absolute;
      inset: -50% -20% -10%;
      background-image:
        linear-gradient(#4da6ff1c 1px, transparent 1px),
        linear-gradient(90deg, #4da6ff1c 1px, transparent 1px);
      background-size: 54px 54px;
      transform: perspective(700px) rotateX(62deg);
      transform-origin: center top;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, transparent 92%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, transparent 92%);
      animation: gridMove 14s linear infinite;
    }
    @keyframes gridMove { to { background-position: 0 54px, 54px 0; } }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, #02040acc 100%);
    }

    #stars { position: absolute; inset: 0; width: 100%; height: 100%; }

    a { color: inherit; font: inherit; }

    /* ---------- کارت ---------- */
    .card {
      width: min(100%, 480px);
      position: relative;
      padding: 34px;
      overflow: hidden;
      border: 1px solid var(--edge);
      border-radius: 32px;
      background:
        radial-gradient(500px circle at var(--mx) var(--my), #3d9bff22, transparent 45%),
        linear-gradient(150deg, #0e1b33a6, #040913d9 75%);
      box-shadow:
        0 40px 110px #000c,
        0 0 90px #1a6fe51f,
        inset 0 1px #ffffff1c,
        inset 0 -1px #ffffff08;
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
      transition: transform .15s ease-out;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--a, 0deg), transparent 0 55%, #4da6ffcc 72%, #8de6ff 80%, transparent 92%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
      animation: spin 7s linear infinite;
    }

    @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
    @keyframes spin { to { --a: 360deg; } }
    @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: none; } }

    .top { display: flex; align-items: center; gap: 17px; margin-bottom: 26px; position: relative; }

    .avatar {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      flex: none;
      position: relative;
      border: 1px solid #b6e1ff85;
      border-radius: 24px;
      color: #fff;
      background: linear-gradient(145deg, #55b0ff, #123f8a 78%);
      box-shadow: 0 12px 34px #1676dc66, 0 0 0 6px #4da6ff12, inset 0 1px #ffffff70;
      font-size: 31px;
      font-weight: 800;
      animation: pulse 3.6s ease-in-out infinite;
    }
    .avatar svg { width: 80%; height: 80%; filter: drop-shadow(0 2px 6px #0a2a5e99); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 12px 34px #1676dc66, 0 0 0 6px #4da6ff12, inset 0 1px #ffffff70; }
      50%     { box-shadow: 0 12px 40px #1676dc99, 0 0 0 11px #4da6ff0a, inset 0 1px #ffffff70; }
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(21px, 5.6vw, 28px);
      line-height: 1.55;
      letter-spacing: -.35px;
      overflow-wrap: anywhere;
      background: linear-gradient(90deg, #ffffff, #a9d6ff 70%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .intro { margin: 0; color: var(--muted); font-size: 14px; }
    .rule { height: 1px; margin: 0 0 19px; background: linear-gradient(90deg, transparent, #7cc0ff55, transparent); }
    .section-label { margin: 0 0 13px; color: #a9c0de; font-size: 12px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
    .section-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); }
    .links { display: grid; gap: 12px; }

    /* ---------- دکمه‌های شیشه‌ای ---------- */
    .link {
      min-height: 60px;
      display: grid;
      grid-template-columns: 38px auto minmax(0, 1fr);
      align-items: center;
      column-gap: 12px;
      padding: 0 14px;
      position: relative;
      overflow: hidden;
      border: 1px solid #cfe8ff30;
      border-radius: 18px;
      background:
        linear-gradient(180deg, #ffffff22 0%, #ffffff08 48%, #ffffff0d 100%);
      box-shadow:
        0 8px 24px #00000055,
        inset 0 1px 0 #ffffff40,
        inset 0 -10px 20px #2a7fe014;
      text-decoration: none;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      -webkit-tap-highlight-color: transparent;
    }

    /* انعکاس نور روی شیشه */
    .link::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 45%;
      left: -70%;
      background: linear-gradient(100deg, transparent, #ffffff30, transparent);
      transform: skewX(-18deg);
      transition: left .7s ease;
      pointer-events: none;
    }

    .link::after {
      content: "";
      position: absolute;
      inset: 0 0 52% 0;
      border-radius: 18px 18px 40px 40px;
      background: linear-gradient(180deg, #ffffff17, transparent);
      pointer-events: none;
    }

    .link:hover, .link:focus-visible {
      transform: translateY(-3px);
      border-color: #6cbfffa6;
      background: linear-gradient(180deg, #4aa5ff40 0%, #ffffff0a 55%, #2a7fe01f 100%);
      box-shadow:
        0 14px 34px #1676dc40,
        0 0 0 1px #4da6ff30,
        inset 0 1px 0 #ffffff55,
        inset 0 -10px 24px #3d9bff22;
      outline: none;
    }
    .link:hover::before, .link:focus-visible::before { left: 130%; }
    .link:active { transform: translateY(0) scale(.985); }

    .icon {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      position: relative; z-index: 1;
      color: var(--blue);
      border: 1px solid #9fd2ff30;
      border-radius: 12px;
      background: linear-gradient(145deg, #4da6ff2e, #0b1f4a40);
      box-shadow: inset 0 1px #ffffff2a;
    }
    .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .label { position: relative; z-index: 1; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .detail {
      position: relative; z-index: 1;
      min-width: 0; justify-self: end;
      color: #b3c7e2;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 12px;
      direction: ltr; text-align: left;
      overflow-wrap: anywhere;
    }
    .email .icon { color: var(--cyan); }

    .footer { margin: 20px 0 0; color: #6c819f; text-align: center; font-size: 11px; }

    @media (max-width: 460px) {
      body { padding: 20px 13px; }
      .card { padding: 26px 18px; border-radius: 28px; }
      .top { align-items: flex-start; gap: 13px; margin-bottom: 22px; }
      .avatar { width: 60px; height: 60px; border-radius: 20px; font-size: 26px; }
      h1 { font-size: 21px; }
      .link { grid-template-columns: 38px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; padding: 11px 13px; }
      .icon { grid-column: 1; grid-row: 1 / 3; align-self: center; }
      .label { grid-column: 2; grid-row: 1; }
      .detail { grid-column: 2; grid-row: 2; justify-self: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <script>
    // ذرات درخشان پس‌زمینه
    (function () {
      var c = document.getElementById('stars');
      var x = c.getContext('2d');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var w, h, dots = [];

      function size() {
        var r = window.devicePixelRatio || 1;
        w = c.width = innerWidth * r;
        h = c.height = innerHeight * r;
        c.style.width = innerWidth + 'px';
        c.style.height = innerHeight + 'px';
        var n = Math.min(90, Math.floor(innerWidth / 12));
        dots = [];
        for (var i = 0; i < n; i++) {
          dots.push({
            x: Math.random() * w, y: Math.random() * h,
            r: (Math.random() * 1.4 + .4) * r,
            v: (Math.random() * .25 + .06) * r,
            a: Math.random() * .6 + .2,
            p: Math.random() * 6.28
          });
        }
      }

      function draw(t) {
        x.clearRect(0, 0, w, h);
        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          d.y -= d.v;
          if (d.y < -4) { d.y = h + 4; d.x = Math.random() * w; }
          var tw = reduce ? 1 : .55 + .45 * Math.sin(t / 900 + d.p);
          x.beginPath();
          x.fillStyle = 'rgba(130,200,255,' + (d.a * tw) + ')';
          x.shadowColor = 'rgba(80,170,255,.9)';
          x.shadowBlur = 8;
          x.arc(d.x, d.y, d.r, 0, 6.283);
          x.fill();
        }
        if (!reduce) requestAnimationFrame(draw);
      }

      size();
      addEventListener('resize', size);
      requestAnimationFrame(draw);
    })();

    // نور دنبال‌کننده ماوس و کمی تیلت سه‌بعدی روی کارت
    (function () {
      var card = document.getElementById('card');
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (!fine) return;

      card.addEventListener('pointermove', function (e) {
        var b = card.getBoundingClientRect();
        var px = (e.clientX - b.left) / b.width;
        var py = (e.clientY - b.top) / b.height;
        card.style.setProperty('--mx', (px * 100) + '%');
        card.style.setProperty('--my', (py * 100) + '%');
        card.style.transform = 'perspective(900px) rotateY(' + ((px - .5) * -5) + 'deg) rotateX(' + ((py - .5) * 5) + 'deg)';
      });
      card.addEventListener('pointerleave', function () {
        card.style.transform = '';
      });
    })();
  </script>
